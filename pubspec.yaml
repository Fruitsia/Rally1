name: rally
description: "Aplicación NUNC."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.3.0
  shared_preferences: ^2.2.0
  # SOS con acompañamiento (GPS, batería, red, permisos, llamadas)
  geolocator: any
  battery_plus: any
  connectivity_plus: any
  permission_handler: any
  url_launcher: any
  android_intent_plus: any
  # Mapa real (OpenStreetMap, sin API key)
  flutter_map: any
  latlong2: any
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo/
    - assets/images/icon_nav/

  fonts:
    - family: CenturyGothic
      fonts:
        - asset: assets/fonts/centurygothic.ttf
        - asset: assets/fonts/centurygothic_bold.ttf
          weight: 700
    - family: Impact
      fonts:
        - asset: assets/fonts/Impact.ttf
