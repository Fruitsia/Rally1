name: rally
description: "Aplicación NUNC."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.3.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo/
    - assets/images/icon_nav/

  fonts:
    - family: CenturyGothic
      fonts:
        - asset: assets/fonts/centurygothic.ttf
        - asset: assets/fonts/centurygothic_bold.ttf
          weight: 700
    - family: Impact
      fonts:
        - asset: assets/fonts/Impact.ttf
